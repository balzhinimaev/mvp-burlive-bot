services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: buryat-bot:latest
    container_name: buryat-bot
    restart: unless-stopped
    
    env_file:
      - .env
    
    environment:
      - NODE_ENV=production
    
    ports:
      - "${PORT}:${PORT}"
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"